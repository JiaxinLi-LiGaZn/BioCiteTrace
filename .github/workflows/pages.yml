name: Publish the BioCiteTrace story

on:
  push:
    branches: [main]
    paths: ['site/**', 'results/provenance.json', 'scripts/check_site.py', '.github/workflows/pages.yml']
  pull_request:
    paths: ['site/**', 'results/provenance.json', 'scripts/check_site.py', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check the story and figure sources
        run: python3 scripts/check_site.py

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
